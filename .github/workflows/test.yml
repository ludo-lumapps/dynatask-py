name: Run Tests

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      valkey:
        image: valkey/valkey:9.0.0-alpine
        # Map port 6379 on the container to port 6379 on the Docker host
        ports:
          - 6379:6379
        # Health check to ensure valkey is up before running tests
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.14"] # Test against one or more versions

    steps:
      # 1. Check out the repository code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install your package + test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      # 4. Run the tests
      - name: Run pytest
        run: pytest
        env:
          REDIS_URL: redis://127.0.0.1:6379/