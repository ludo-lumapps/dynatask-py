[project]
name = "dynatask"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["valkey == 6.2.0"]

[project.urls]
Homepage = "https://github.com/ludo-lumapps/dynatask-py"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = ["pytest", "msgspec", "pyright"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Explicitly clamp Ruff down to ONLY standard Pycodestyle (E) and Pyflakes (F).
# This acts as a strict boundary that the VS Code extension cannot cross.
select = ["E", "F"]

[tool.pyright]
exclude = ["tests"]